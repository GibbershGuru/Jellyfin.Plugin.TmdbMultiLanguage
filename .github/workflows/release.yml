name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p package
          cp bin/Release/net10.0/Jellyfin.Plugin.TmdbMultiLanguage.dll package/
          cd package
          zip -r "../Jellyfin.Plugin.TmdbMultiLanguage_v${VERSION}.zip" .
          cd ..
          md5sum "Jellyfin.Plugin.TmdbMultiLanguage_v${VERSION}.zip" | awk '{print toupper($1)}' > checksum.txt

      - name: Fix manifest checksum environment
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHECKSUM="$(cat checksum.txt)"
          SOURCE_URL="https://github.com/GibbershGuru/Jellyfin.Plugin.TmdbMultiLanguage/releases/download/v${VERSION}/Jellyfin.Plugin.TmdbMultiLanguage_v${VERSION}.zip"
          python3 - "$VERSION" "$CHECKSUM" "$SOURCE_URL" <<'PY'
          import json, sys
          version, checksum, source = sys.argv[1:]
          with open("manifest.json", encoding="utf-8") as f:
              data=json.load(f)
          data[0]["versions"]=[x for x in data[0].get("versions",[]) if x.get("version") != version]
          data[0]["versions"].insert(0, {
              "version": version,
              "changelog": "Jellyfin 12.1 / .NET 10 compatibility release.",
              "targetAbi": "12.1.0.0",
              "sourceUrl": source,
              "checksum": checksum
          })
          with open("manifest.json","w",encoding="utf-8") as f:
              json.dump(data,f,indent=2); f.write("\n")
          PY

      - name: Commit manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update manifest for v${{ steps.version.outputs.version }}"
            git push origin HEAD:main
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: Jellyfin.Plugin.TmdbMultiLanguage_v${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
