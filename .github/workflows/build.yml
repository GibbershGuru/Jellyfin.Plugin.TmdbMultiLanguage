name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Package
        run: |
          mkdir -p artifact
          cp bin/Release/net10.0/Jellyfin.Plugin.TmdbMultiLanguage.dll artifact/
          cp README.md artifact/
          cd artifact && zip -r ../Jellyfin.Plugin.TmdbMultiLanguage.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.TmdbMultiLanguage
          path: Jellyfin.Plugin.TmdbMultiLanguage.zip